<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台 · AI 伯乐</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #FDF7F0; color: #4A1B0C;
  display: flex; flex-direction: column;
}
.header {
  padding: 14px 24px; background: rgba(255,255,255,0.55);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.header h1 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.btn-logout {
  background: transparent; border: 1px solid rgba(0,0,0,0.12); color: #8b6b5a;
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  font-weight: 500; transition: all 0.2s;
}
.btn-logout:hover { border-color: #e04040; color: #e04040; }
.header-teacher-name {
  font-size: 13px; color: #8b6b5a; font-weight: 500;
  padding: 4px 12px; background: rgba(216,90,48,0.06); border-radius: 8px;
}

.body { flex: 1; overflow-y: auto; padding: 24px; max-width: 720px; margin: 0 auto; width: 100%; }
.body::-webkit-scrollbar { width: 4px; }
.body::-webkit-scrollbar-thumb { background: #e0d0c0; border-radius: 4px; }

/* ================================================================
   Bind Section
   ================================================================ */
.bind-section {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6); border-radius: 18px; padding: 20px 24px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.05); margin-bottom: 24px;
}
.bind-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.bind-row { display: flex; gap: 10px; }
.bind-row input {
  flex: 1; padding: 12px 16px; border: 2px solid rgba(216,90,48,0.12); border-radius: 14px;
  font-size: 14px; outline: none; background: rgba(255,255,255,0.6); color: #4A1B0C;
  transition: all 0.3s;
}
.bind-row input:focus { border-color: rgba(216,90,48,0.45); box-shadow: 0 0 0 4px rgba(216,90,48,0.06); }
.bind-row button {
  padding: 12px 24px; border: none; border-radius: 14px; font-size: 14px; font-weight: 600;
  background: linear-gradient(180deg, #F08868 0%, #D85A30 35%, #C44A20 100%); color: #fff;
  cursor: pointer; box-shadow: 0 4px 0 #A83818, 0 6px 16px rgba(216,90,48,0.2);
  transition: all 0.18s ease; position: relative; top: 0; white-space: nowrap;
}
.bind-row button:hover:not(:disabled) { top: -1px; box-shadow: 0 5px 0 #A83818, 0 8px 20px rgba(216,90,48,0.28); }
.bind-row button:active:not(:disabled) { top: 2px; box-shadow: 0 2px 0 #A83818, 0 3px 8px rgba(216,90,48,0.12); }
.bind-row button:disabled { opacity: 0.5; cursor: not-allowed; top: 0; }
.bind-msg { margin-top: 10px; font-size: 13px; color: #6b5040; min-height: 18px; }
.bind-msg.ok { color: #5a8a5a; }
.bind-msg.err { color: #e04040; }
.bind-hint { font-size: 12px; color: #b0a080; margin-top: 8px; line-height: 1.5; }

/* ================================================================
   Safety Alert Card — always visible at top
   ================================================================ */
.safety-card {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6); border-radius: 14px;
  margin-bottom: 16px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03);
  transition: all 0.25s;
}
.safety-card-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; cursor: pointer; user-select: none;
  transition: background 0.15s; gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
.safety-card-header:hover { background: rgba(0,0,0,0.015); }
.safety-card-left {
  display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;
}
.safety-card-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.safety-card-info { min-width: 0; }
.safety-card-title {
  font-size: 14px; font-weight: 700; color: #4A1B0C;
  display: flex; align-items: center; gap: 6px;
}
.safety-card-summary {
  font-size: 12px; color: #a09080; margin-top: 2px;
}
.safety-card-right {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.safety-card-badge {
  font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 10px;
  white-space: nowrap;
}
.safety-card-arrow {
  font-size: 12px; color: #b0a0a0; transition: transform 0.2s;
}
.safety-card.expanded .safety-card-arrow { transform: rotate(90deg); }

/* Safety states */
.safety-card.safe .safety-card-icon { background: #eaf7ea; }
.safety-card.safe .safety-card-badge { background: #eaf7ea; color: #3a7030; }
.safety-card.warn .safety-card-icon { background: #fff4e0; }
.safety-card.warn .safety-card-badge { background: #fff4e0; color: #8b5a20; }
.safety-card.alert .safety-card-icon { background: #fff0f0; }
.safety-card.alert .safety-card-badge { background: #fff0f0; color: #a04040; }

/* Safety detail list */
.safety-card-body { display: none; padding: 0 18px 14px; }
.safety-card.expanded .safety-card-body { display: block; }

.safety-student-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; margin-bottom: 6px;
  background: rgba(253,247,240,0.6); border-radius: 10px;
  cursor: pointer; transition: background 0.15s;
  border: 1px solid rgba(0,0,0,0.04);
}
.safety-student-item:hover { background: rgba(254,240,232,0.5); }
.safety-student-name {
  font-size: 13px; font-weight: 600; color: #4A1B0C;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
  max-width: 100px;
}
.safety-student-note {
  flex: 1; min-width: 0; font-size: 12px; color: #8b6b5a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.safety-student-count {
  font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  background: #fff0f0; color: #a04040; white-space: nowrap; flex-shrink: 0;
}
.safety-student-arrow {
  color: #c0b8b0; font-size: 12px; flex-shrink: 0;
}

/* ================================================================
   Roster Summary Card — big clickable tile
   ================================================================ */
.roster-summary-card {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6); border-radius: 18px;
  padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; gap: 18px;
}
.roster-summary-card:hover {
  background: rgba(255,255,255,0.7);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.08);
}

/* Icon block */
.roster-icon {
  width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
  background: linear-gradient(135deg, #fef0e8 0%, #fde0cc 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; border: 2px solid #fdd4b8;
}

/* Content */
.roster-info { flex: 1; min-width: 0; }
.roster-title {
  font-size: 17px; font-weight: 700; color: #4A1B0C;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}

.roster-subtitle {
  font-size: 13px; color: #a09080; line-height: 1.5;
}

.roster-stats {
  display: flex; gap: 20px; margin-top: 6px;
}
.roster-stat {
  display: flex; align-items: baseline; gap: 4px;
  font-size: 12px; color: #a09080;
}
.roster-stat strong {
  font-size: 16px; font-weight: 700; color: #D85A30;
}

/* Arrow */
.roster-arrow {
  color: #d0c8c0; font-size: 22px; flex-shrink: 0;
  transition: all 0.25s;
}
.roster-summary-card:hover .roster-arrow {
  color: #D85A30; transform: translateX(3px);
}

/* Safety Alert Banner — prominent red banner at top */
.safety-alert-banner {
  display: none;
  background: linear-gradient(135deg, #fff0f0 0%, #ffe8e8 100%);
  border: 2px solid #f05e68;
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 16px;
  animation: safetyPulse 2s ease-in-out infinite;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(240, 94, 104, 0.18);
}
@keyframes safetyPulse {
  0%, 100% { border-color: #f05e68; }
  50% { border-color: #ff8a92; }
}
.safety-alert-banner.show { display: flex; align-items: center; gap: 12px; }
.safety-alert-banner-icon { font-size: 28px; flex-shrink: 0; }
.safety-alert-banner-content { flex: 1; min-width: 0; }
.safety-alert-banner-title {
  font-size: 15px; font-weight: 700; color: #a04040;
  margin-bottom: 2px;
}
.safety-alert-banner-subtitle {
  font-size: 12px; color: #c07070;
}
.safety-alert-banner-count {
  font-size: 22px; font-weight: 800; color: #d04040;
  background: #fff; padding: 6px 14px; border-radius: 10px;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(240,94,104,0.12);
}
.safety-alert-banner-arrow { color: #c08080; font-size: 18px; flex-shrink: 0; }

/* Safety processing list */
.safety-process-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; margin-bottom: 8px;
  background: rgba(253,247,240,0.8); border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.04);
  flex-wrap: wrap;
}
.safety-process-item.resolved {
  opacity: 0.6; background: rgba(240,248,240,0.6);
}
.safety-process-student {
  font-size: 13px; font-weight: 700; color: #4A1B0C;
  white-space: nowrap; min-width: 70px;
}
.safety-process-info {
  flex: 1; min-width: 0; font-size: 12px; color: #6b5040;
}
.safety-process-time {
  font-size: 11px; color: #b0a0a0; white-space: nowrap;
}
.safety-process-actions {
  width: 100%; margin-top: 8px;
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.safety-process-actions button {
  min-height: 30px; padding: 0 10px; font-size: 12px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: #fff; cursor: pointer; color: #4f5b76;
  transition: .14s ease;
}
.safety-process-actions button:hover { border-color: #aaa1ff; }
.safety-process-actions button.active-action {
  color: #fff; border-color: transparent;
}
.safety-process-actions button.btn-contact { background: #4d7ef3; }
.safety-process-actions button.btn-follow { background: #ff9829; }
.safety-process-actions button.btn-confirm { background: #22b66b; }
.safety-process-note {
  width: 100%; margin-top: 6px; min-height: 32px; padding: 6px 10px;
  font-size: 12px; border: 1px solid var(--line-2); border-radius: 8px;
  resize: vertical; font-family: inherit;
}
.safety-process-submit {
  margin-top: 4px; min-height: 32px; padding: 0 14px;
  border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
  background: var(--primary); color: #fff; cursor: pointer;
}
.safety-process-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.safety-process-result {
  font-size: 11px; color: #22b66b; margin-top: 4px; width: 100%;
}
.safety-process-result.err { color: #e04040; }

/* Loading skeleton */
.roster-summary-card.loading {
  pointer-events: none; opacity: 0.6;
}
.roster-summary-card.loading .roster-subtitle { color: #d0c8c0; }
.roster-summary-card.loading .roster-stat strong { opacity: 0; }
.roster-summary-card.loading .roster-stat { color: transparent; background: #f0e8e0; border-radius: 4px; }

/* ================================================================
   Responsive
   ================================================================ */
@media (max-width: 768px) {
  .header { padding: 10px 14px; }
  .header h1 { font-size: 16px; }
  .body { padding: 14px; max-width: 100%; }
  .bind-section { padding: 16px; border-radius: 14px; }
  .bind-row { flex-direction: column; gap: 8px; }
  .bind-row input { min-height: 44px; font-size: 16px; padding: 10px 14px; }
  .bind-row button { min-height: 44px; min-width: 44px; padding: 12px 20px; font-size: 15px; }
  .safety-card-header { padding: 12px 14px; }
  .safety-card-icon { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .safety-card-title { font-size: 13px; }
  .safety-card-body { padding: 0 14px 10px; }
  .roster-summary-card { padding: 18px 20px; border-radius: 16px; }
  .roster-icon { width: 48px; height: 48px; font-size: 24px; border-radius: 14px; }
  .roster-title { font-size: 15px; }
  .btn-logout { min-height: 44px; padding: 10px 16px; font-size: 14px; }
  .bind-msg { font-size: 12px; }
  .bind-hint { font-size: 11px; }
  html, body { -webkit-tap-highlight-color: transparent; }
  .body { -webkit-overflow-scrolling: touch; }
}

@media (max-width: 400px) {
  .header { padding: 8px 10px; }
  .header h1 { font-size: 15px; }
  .body { padding: 10px; }
  .bind-section { padding: 12px; border-radius: 12px; }
  .bind-section h2 { font-size: 14px; }
  .bind-row input { font-size: 14px; }
  .bind-row button { font-size: 14px; padding: 10px 16px; }
  .roster-summary-card { padding: 14px 16px; border-radius: 14px; }
  .roster-icon { width: 42px; height: 42px; font-size: 20px; border-radius: 12px; }
  .roster-title { font-size: 14px; }
  .roster-stats { gap: 14px; }
  .roster-stat strong { font-size: 14px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 教师后台</h1>
  <div class="header-right">
    <span class="header-teacher-name" id="teacherNameDisplay"></span>
    <button class="btn-logout" onclick="handleLogout()">退出登录</button>
  </div>
</div>

<div class="body">
  <div class="bind-section">
    <h2>🔗 绑定学生</h2>
    <div class="bind-row">
      <input type="text" id="bindingTokenInput" placeholder="粘贴学生发给你的邀请码" maxlength="43" autocomplete="off">
      <button id="btnBind" onclick="bindStudent()">绑定</button>
    </div>
    <div class="bind-hint">请学生在他的「我的」页面中创建邀请码，然后将完整的邀请码发给你。</div>
    <div class="bind-msg" id="bindMsg"></div>
  </div>

  <!-- 安全提示待处理横幅（强提醒） -->
  <div class="safety-alert-banner" id="safetyAlertBanner" onclick="toggleSafetyBanner()">
    <div class="safety-alert-banner-icon">🚨</div>
    <div class="safety-alert-banner-content">
      <div class="safety-alert-banner-title" id="safetyBannerTitle">有安全提示待处理</div>
      <div class="safety-alert-banner-subtitle" id="safetyBannerSubtitle">点击查看详情并处理</div>
    </div>
    <div class="safety-alert-banner-count" id="safetyBannerCount">0</div>
    <div class="safety-alert-banner-arrow" id="safetyBannerArrow">▶</div>
  </div>

  <!-- 安全提示处理面板（横幅展开后显示） -->
  <div class="safety-card warn" id="safetyProcessPanel" style="display:none;">
    <div class="safety-card-header" onclick="toggleSafetyProcessPanel()">
      <div class="safety-card-left">
        <div class="safety-card-icon">⚠️</div>
        <div class="safety-card-info">
          <div class="safety-card-title">安全提示处理</div>
          <div class="safety-card-summary" id="safetyPanelSummary">—</div>
        </div>
      </div>
      <div class="safety-card-right">
        <span class="safety-card-badge" id="safetyPanelBadge">—</span>
        <span class="safety-card-arrow">▶</span>
      </div>
    </div>
    <div class="safety-card-body" id="safetyProcessBody"></div>
  </div>

  <!-- 安全风险识别 -->
  <div class="safety-card safe" id="safetyCard" style="display:none;">
    <div class="safety-card-header" onclick="toggleSafetyCard()">
      <div class="safety-card-left">
        <div class="safety-card-icon">🛡️</div>
        <div class="safety-card-info">
          <div class="safety-card-title" id="safetyTitle">安全风险识别</div>
          <div class="safety-card-summary" id="safetySummary"></div>
        </div>
      </div>
      <div class="safety-card-right">
        <span class="safety-card-badge" id="safetyBadge"></span>
        <span class="safety-card-arrow">▶</span>
      </div>
    </div>
    <div class="safety-card-body" id="safetyBody"></div>
  </div>

  <!-- 学生名单概览卡片 -->
  <div class="roster-summary-card loading" id="rosterCard" onclick="openRoster()">
    <div class="roster-icon">📋</div>
    <div class="roster-info">
      <div class="roster-title">我的学生名单 <span style="font-size:12px;font-weight:400;color:#a09080;" id="rosterCount"></span></div>
      <div class="roster-subtitle" id="rosterSubtitle">正在加载…</div>
      <div class="roster-stats" id="rosterStats">
        <span class="roster-stat">💬 <strong id="statConversations">-</strong> 总对话</span>
        <span class="roster-stat">💡 <strong id="statInsights">-</strong> 总线索</span>
      </div>
    </div>
    <span class="roster-arrow">›</span>
  </div>
</div>

<script>
// ================================================================
//  Login guard
// ================================================================
(function () {
  fetch('/api/auth/me').then(function (resp) {
    if (!resp.ok) { window.location.href = '/login.html?role=teacher'; return null; }
    return resp.json();
  }).then(function (data) {
    if (data && data.user && data.user.role !== 'teacher') {
      window.location.href = '/home.html';
      return;
    }
    if (data && data.user && data.user.username) {
      document.getElementById('teacherNameDisplay').textContent = '👩‍🏫 ' + data.user.username;
    }
  }).catch(function () {
    window.location.href = '/login.html?role=teacher';
  });
})();

function handleLogout() {
  fetch('/api/auth/logout', { method: 'POST' }).then(function () {
    window.location.href = '/login.html?role=teacher';
  });
}

// ================================================================
//  Helpers
// ================================================================

function txt(text) {
  if (typeof text !== 'string') return '';
  return text;
}

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function fmtInt(n) {
  if (typeof n !== 'number' || !isFinite(n) || n < 0) return '0';
  return String(Math.floor(n));
}

// ================================================================
//  Load roster summary for the card
// ================================================================

// ================================================================
//  Safety signal processing (new: with persistence and closed loop)
// ================================================================

var _safetyBannerExpanded = false;
var _safetyPanelExpanded = false;
var _safetySignals = [];
var _pendingCount = 0;

function toggleSafetyBanner() {
  _safetyBannerExpanded = !_safetyBannerExpanded;
  var panel = document.getElementById('safetyProcessPanel');
  var arrow = document.getElementById('safetyBannerArrow');
  if (_safetyBannerExpanded) {
    panel.style.display = '';
    arrow.textContent = '▼';
    if (_safetySignals.length === 0) loadSafetySignals();
  } else {
    panel.style.display = 'none';
    arrow.textContent = '▶';
  }
}

function toggleSafetyProcessPanel() {
  var panel = document.getElementById('safetyProcessPanel');
  _safetyPanelExpanded = !_safetyPanelExpanded;
  if (_safetyPanelExpanded) {
    panel.classList.add('expanded');
  } else {
    panel.classList.remove('expanded');
  }
}

function loadSafetySignals() {
  fetch('/api/teacher/safety-signals?status=pending').then(function (r) {
    if (!r.ok) return null;
    return r.json();
  }).then(function (data) {
    if (!data) return;
    _safetySignals = data.signals || [];
    _pendingCount = data.pendingCount || 0;
    renderSafetyBanner();
    renderSafetyProcessPanel();
  }).catch(function () {});
}

function loadPendingCount() {
  fetch('/api/teacher/safety-signals/pending-count').then(function (r) {
    if (!r.ok) return null;
    return r.json();
  }).then(function (data) {
    if (!data) return;
    _pendingCount = data.pendingCount || 0;
    updateBannerCount();
  }).catch(function () {});
}

function updateBannerCount() {
  var banner = document.getElementById('safetyAlertBanner');
  var countEl = document.getElementById('safetyBannerCount');
  var title = document.getElementById('safetyBannerTitle');
  var subtitle = document.getElementById('safetyBannerSubtitle');
  countEl.textContent = _pendingCount;
  if (_pendingCount > 0) {
    banner.classList.add('show');
    title.textContent = '有安全提示待处理';
    subtitle.textContent = _pendingCount + ' 条安全提示需要你确认处理';
  } else {
    banner.classList.remove('show');
    document.getElementById('safetyProcessPanel').style.display = 'none';
  }
}

function renderSafetyBanner() {
  updateBannerCount();
}

function renderSafetyProcessPanel() {
  var body = document.getElementById('safetyProcessBody');
  var badge = document.getElementById('safetyPanelBadge');
  var summary = document.getElementById('safetyPanelSummary');

  badge.textContent = _pendingCount + ' 条待处理';
  summary.textContent = '请逐条选择处理方式并填写备注（至少10字）';

  body.textContent = '';

  if (_safetySignals.length === 0) {
    body.textContent = '';
    var allClear = document.createElement('div');
    allClear.style.cssText = 'text-align:center;padding:16px;color:#5a8a5a;font-size:13px;';
    allClear.textContent = '✨ 所有安全提示已处理完毕';
    body.appendChild(allClear);
    return;
  }

  for (var i = 0; i < _safetySignals.length; i++) {
    body.appendChild(buildSafetyProcessItem(_safetySignals[i]));
  }
}

function buildSafetyProcessItem(signal) {
  var item = document.createElement('div');
  item.className = 'safety-process-item';
  item.id = 'sp-' + signal.id;

  // Student name
  var nameSpan = document.createElement('span');
  nameSpan.className = 'safety-process-student';
  nameSpan.textContent = txt(signal.studentId);
  nameSpan.style.cursor = 'pointer';
  nameSpan.title = '点击查看学生详情';
  nameSpan.addEventListener('click', function (e) {
    e.stopPropagation();
    viewStudent(signal.studentId);
  });
  item.appendChild(nameSpan);

  // Info
  var info = document.createElement('div');
  info.className = 'safety-process-info';
  var topicText = signal.activeTopic ? '话题：' + signal.activeTopic : '无话题标签';
  var notePreview = (signal.safetyNote || '').length > 60
    ? signal.safetyNote.slice(0, 60) + '…'
    : (signal.safetyNote || '无详细说明');
  info.innerHTML = '<div>' + topicText + '</div><div style="color:#888;">' + notePreview + '</div>';
  item.appendChild(info);

  // Time
  var timeSpan = document.createElement('span');
  timeSpan.className = 'safety-process-time';
  timeSpan.textContent = signal.conversationStartTime ? fmtDateShort(signal.conversationStartTime) : '';
  item.appendChild(timeSpan);

  // Actions
  var actions = document.createElement('div');
  actions.className = 'safety-process-actions';

  var btnContact = document.createElement('button');
  btnContact.className = 'btn-contact';
  btnContact.textContent = '已联系家长';
  btnContact.addEventListener('click', function () { selectAction(signal.id, 'contacted_parent', btnContact, actions); });
  actions.appendChild(btnContact);

  var btnFollow = document.createElement('button');
  btnFollow.className = 'btn-follow';
  btnFollow.textContent = '已跟进观察';
  btnFollow.addEventListener('click', function () { selectAction(signal.id, 'followed_up', btnFollow, actions); });
  actions.appendChild(btnFollow);

  var btnConfirm = document.createElement('button');
  btnConfirm.className = 'btn-confirm';
  btnConfirm.textContent = '确认无需处理';
  btnConfirm.addEventListener('click', function () { selectAction(signal.id, 'confirmed_no_action', btnConfirm, actions); });
  actions.appendChild(btnConfirm);

  item.appendChild(actions);

  // Note textarea + submit
  var noteArea = document.createElement('textarea');
  noteArea.className = 'safety-process-note';
  noteArea.placeholder = '请填写处理备注（至少10字）…';
  noteArea.style.display = 'none';
  noteArea.dataset.signalId = signal.id;
  item.appendChild(noteArea);

  var submitBtn = document.createElement('button');
  submitBtn.className = 'safety-process-submit';
  submitBtn.textContent = '提交处理';
  submitBtn.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.dataset.signalId = signal.id;
  submitBtn.addEventListener('click', function () { submitProcess(signal.id); });
  item.appendChild(submitBtn);

  // Result
  var result = document.createElement('div');
  result.className = 'safety-process-result';
  result.id = 'spr-' + signal.id;
  item.appendChild(result);

  return item;
}

// Per-item state
var _processState = {};  // signalId -> { status, pendingSubmission: bool }

function selectAction(signalId, status, clickedBtn, actionsDiv) {
  // Clear all active-action in this group
  var buttons = actionsDiv.querySelectorAll('button');
  for (var bi = 0; bi < buttons.length; bi++) {
    if (buttons[bi].classList.contains('active-action')) {
      buttons[bi].classList.remove('active-action');
    }
  }
  clickedBtn.classList.add('active-action');

  // Show note area
  var item = document.getElementById('sp-' + signalId);
  var noteArea = item.querySelector('.safety-process-note');
  var submitBtn = item.querySelector('.safety-process-submit');
  noteArea.style.display = '';
  submitBtn.style.display = '';
  submitBtn.disabled = false;

  _processState[signalId] = { status: status, pendingSubmission: true };

  // Enable submit when note >= 10 chars
  noteArea.addEventListener('input', function () {
    var len = (noteArea.value || '').trim().length;
    submitBtn.disabled = len < 10;
  });
}

function submitProcess(signalId) {
  var state = _processState[signalId];
  if (!state || !state.pendingSubmission) return;

  var item = document.getElementById('sp-' + signalId);
  var noteArea = item.querySelector('.safety-process-note');
  var submitBtn = item.querySelector('.safety-process-submit');
  var result = document.getElementById('spr-' + signalId);
  var noteVal = (noteArea.value || '').trim();

  if (noteVal.length < 10) {
    result.textContent = '备注至少需要10个字';
    result.className = 'safety-process-result err';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '提交中…';
  result.textContent = '';
  result.className = 'safety-process-result';

  fetch('/api/teacher/safety-signals/' + encodeURIComponent(signalId), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: state.status, note: noteVal }),
  }).then(function (r) {
    if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || 'FAIL'); });
    return r.json();
  }).then(function () {
    result.textContent = '✓ 处理完成';
    result.className = 'safety-process-result';
    item.classList.add('resolved');
    noteArea.style.display = 'none';
    submitBtn.style.display = 'none';
    _pendingCount--;
    updateBannerCount();
    if (_pendingCount <= 0) {
      document.getElementById('safetyProcessPanel').style.display = 'none';
    }
  }).catch(function (e) {
    result.textContent = '提交失败：' + (e.message || '请重试');
    result.className = 'safety-process-result err';
    submitBtn.disabled = false;
    submitBtn.textContent = '提交处理';
  });
}

function fmtDateShort(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  } catch (_) { return ''; }
}

// ================================================================
//  Load roster summary for the card
// ================================================================

function loadRosterSummary() {
  var card = document.getElementById('rosterCard');

  fetch('/api/teacher/roster').then(function (resp) {
    if (resp.status === 401) {
      window.location.href = '/login.html?role=teacher';
      return null;
    }
    if (resp.status === 403) {
      card.classList.remove('loading');
      document.getElementById('rosterSubtitle').textContent = '当前账号不是教师';
      return null;
    }
    if (!resp.ok) {
      card.classList.remove('loading');
      document.getElementById('rosterSubtitle').textContent = '加载失败，点击重试';
      return null;
    }
    return resp.json().then(function (data) {
      card.classList.remove('loading');

      // Safety card (always render)
      if (Array.isArray(data)) {
        renderSafetyCard(data);
      }

      if (!Array.isArray(data) || data.length === 0) {
        document.getElementById('rosterCount').textContent = '';
        document.getElementById('rosterSubtitle').textContent = '还没有绑定学生，点击查看';
        document.getElementById('statConversations').textContent = '0';
        document.getElementById('statInsights').textContent = '0';
        return;
      }

      var total = data.length;
      var totalConv = 0;
      var totalIns = 0;
      var activeCount = 0;

      for (var i = 0; i < data.length; i++) {
        totalConv += (typeof data[i].totalConversations === 'number' ? data[i].totalConversations : 0);
        totalIns += (typeof data[i].insightCount === 'number' ? data[i].insightCount : 0);
        var rn = (typeof data[i].recentInsightCount7d === 'number' && data[i].recentInsightCount7d >= 0) ? data[i].recentInsightCount7d : 0;
        if (rn > 0) activeCount++;
      }

      document.getElementById('rosterCount').textContent = '· ' + total + ' 名学生';
      document.getElementById('rosterSubtitle').textContent = activeCount > 0
        ? activeCount + ' 名近期有新线索'
        : '近期暂无新线索';
      document.getElementById('statConversations').textContent = fmtInt(totalConv);
      document.getElementById('statInsights').textContent = fmtInt(totalIns);

      // Also load pending safety count
      loadPendingCount();
    });
  }).catch(function () {
    card.classList.remove('loading');
    document.getElementById('rosterSubtitle').textContent = '网络错误，点击重试';
  });
}

// ================================================================
//  Bind student — token exchange
// ================================================================

var bindSubmitting = false;

function bindStudent() {
  if (bindSubmitting) return;
  var input = document.getElementById('bindingTokenInput');
  var msg = document.getElementById('bindMsg');
  var btn = document.getElementById('btnBind');
  var rawToken = input.value.trim();

  if (!rawToken || rawToken.length !== 43) {
    msg.textContent = '邀请码格式不正确，请检查是否完整复制（应为43位字符）';
    msg.className = 'bind-msg err'; return;
  }

  bindSubmitting = true;
  btn.disabled = true;
  input.disabled = true;
  msg.textContent = '';
  msg.className = 'bind-msg';

  fetch('/api/teacher/bind-student', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bindingToken: rawToken }),
  }).then(function (resp) {
    return resp.json().then(function (data) {
      if (!resp.ok) {
        if (resp.status === 401) {
          window.location.href = '/login.html?role=teacher';
          return;
        } else if (resp.status === 403) {
          msg.textContent = '当前账号不是教师，请使用教师账号登录';
        } else if (resp.status === 429) {
          msg.textContent = '操作过于频繁，请稍后再试';
        } else if (data.error === 'LEGACY_STUDENT_CODE_BINDING_DISABLED') {
          msg.textContent = '请使用学生提供的邀请码';
        } else if (data.error === 'INVALID_REQUEST') {
          msg.textContent = '邀请码格式不正确，请检查是否完整复制';
        } else if (data.error === 'BINDING_TOKEN_INVALID') {
          msg.textContent = '该邀请码无效或已失效，请向学生获取新的邀请码';
        } else {
          msg.textContent = '服务器繁忙，请稍后重试';
        }
        msg.className = 'bind-msg err';
        return;
      }

      if (data.alreadyBound) {
        msg.textContent = '你已经绑定过该学生：' + txt(data.student ? data.student.username : '');
      } else {
        msg.textContent = '绑定成功：' + txt(data.student ? data.student.username : '') + ' 已加入你的名单';
      }
      msg.className = 'bind-msg ok';
      input.value = '';
      loadRosterSummary();
    });
  }).catch(function () {
    msg.textContent = '网络错误，请检查网络连接后重试';
    msg.className = 'bind-msg err';
  }).finally(function () {
    bindSubmitting = false;
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  });
}

window.bindStudent = bindStudent;

// ================================================================
//  Enter key for bind input
// ================================================================

document.getElementById('bindingTokenInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') bindStudent();
});

// Load summary on page load
loadRosterSummary();
