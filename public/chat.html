<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小新 · 和小新聊天</title>
  <style>
/* ============================================================
   以下完全来自 xiaoxin-chat-interface-complete-demo/style.css
   ============================================================ */
:root{
  --brown:#51291f;--brown2:#7d5749;--brown3:#a18477;
  --orange:#ff7640;--orange2:#f15d2d;--cream:#fffaf4;
  --line:rgba(100,58,41,.13);--line2:rgba(100,58,41,.20);
  --soft:0 8px 20px rgba(95,63,44,.08);--card:0 15px 36px rgba(95,63,44,.11);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{margin:0;min-width:320px;overflow:hidden;color:var(--brown);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#dceff7}
button,textarea,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,118,64,.28);outline-offset:2px}
.app-shell{width:100%;height:100vh;padding:8px;background:linear-gradient(rgba(235,249,255,.56),rgba(255,249,240,.56)),url("assets/backgrounds/app-background-clean.svg") center/cover no-repeat}
.app-frame{width:100%;height:100%;overflow:hidden;border:2px solid rgba(255,255,255,.88);border-radius:27px;background:rgba(255,251,246,.94);box-shadow:0 20px 60px rgba(62,84,89,.16);backdrop-filter:blur(9px)}

/* ---- Topbar ---- */
.topbar{height:72px;display:grid;grid-template-columns:260px minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,249,243,.96)}
.brand{height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:18px;font-weight:950}
.brand-logo{width:52px;height:52px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#fff;box-shadow:var(--soft)}
.brand-logo img{width:50px;height:50px;object-fit:contain}
.page-title{height:100%;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:950}.page-title img{width:26px;height:26px}
.weather-badge{display:inline-flex;align-items:center;margin-left:2px}
.weather-badge svg{stroke:#587594}
.top-actions{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px}
.top-button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid var(--line2);border-radius:16px;background:#fffdfa;box-shadow:0 6px 16px rgba(98,62,42,.06);font-size:15px;font-weight:900;cursor:pointer;transition:.16s}
.top-button img{width:22px;height:22px}.top-button:hover{transform:translateY(-2px);box-shadow:0 10px 23px rgba(98,62,42,.10)}.top-button.danger{color:#d94821;border-color:rgba(241,93,45,.72)}

.workspace{height:calc(100% - 72px);display:grid;grid-template-columns:300px minmax(500px,1fr) 110px;background:rgba(255,253,249,.80)}
.history-panel{min-width:0;overflow:hidden;border-right:1px solid var(--line);background:rgba(255,249,243,.94)}
.history-inner{height:100%;display:flex;flex-direction:column;padding:17px 14px 14px}
.history-title{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:18px}.history-title img{width:26px;height:26px}
.search-box{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border:2px solid rgba(243,135,93,.42);border-radius:22px;background:#fffdfa}
.search-box img{width:22px;height:22px}.search-box input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:16px}.search-box input::placeholder{color:#9e8c86}
.history-list{min-height:0;display:grid;gap:10px;margin-top:12px;overflow-y:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:#dec9b8 transparent}
.history-list::-webkit-scrollbar{width:5px}
.history-list::-webkit-scrollbar-thumb{background:#dec9b8;border-radius:4px}
.history-card{min-height:74px;position:relative;display:grid;grid-template-columns:1fr auto;grid-template-areas:"title title" "date mood";gap:5px 7px;padding:12px 14px 10px;border:1px solid rgba(117,74,54,.08);border-radius:22px;text-align:left;background:rgba(255,255,255,.86);box-shadow:var(--soft);cursor:pointer;font-family:inherit;font-size:inherit;color:inherit;width:100%}
.history-card:hover{transform:translateY(-2px);border-color:rgba(255,118,64,.32)}.history-card.active{border:2px solid rgba(255,118,64,.58);background:#fff7f0}
.active-line{position:absolute;left:0;top:12px;bottom:12px;width:6px;border-radius:0 999px 999px 0;background:var(--orange)}
.history-card strong{grid-area:title;font-size:14px;line-height:1.45;font-weight:700}
.history-card small{grid-area:date;color:var(--brown3);font-size:11px}
.history-card em{grid-area:mood;justify-self:end;color:#a58b80;font-size:11px;font-style:normal}
.hi-del{position:absolute;right:16px;top:14px;background:none;border:none;color:#d0c8c0;cursor:pointer;font-size:18px;padding:0 4px;line-height:1;z-index:2}
.hi-del:hover{color:#d94821}
.empty-search{margin:28px 0;text-align:center;color:var(--brown3);font-size:14px}
.empty-history{padding:30px 0;text-align:center;color:var(--brown3);font-size:14px}

/* ===== Main Panel — 去掉了hero，直接就是聊天 ===== */
.main-panel{min-width:0;min-height:0;overflow:hidden}

/* ===== Chat Section — 填满主面板 ===== */
.chat-section{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}
.chat-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}

/* ---- Messages ---- */
.messages{flex:1;position:relative;z-index:2;overflow-y:auto;padding:20px 36px 190px;scrollbar-width:thin;scrollbar-color:#8f8a86 transparent}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:#dec9b8;border-radius:4px}

/* ---- Message Row ---- */
.message-row{display:flex;align-items:flex-end;gap:9px;flex-shrink:0;margin-bottom:10px}
.message-row.user{justify-content:flex-end}
.message-avatar{width:54px;height:54px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#fff8f0}
.message-avatar img{width:66px;height:66px;object-fit:contain}
.message-avatar.student{width:58px;height:58px;background:#eef8ff}
.message-avatar.student img{width:52px;height:62px;object-fit:contain}

/* ---- Bubble ---- */
.message-bubble{max-width:min(480px,58%);height:auto;min-height:0;overflow:visible;padding:12px 15px 11px;border:1px solid rgba(221,162,120,.58);border-radius:22px 22px 22px 7px;color:#664033;background:#fff7f0;box-shadow:0 7px 16px rgba(95,63,44,.05);line-height:1.55;word-break:break-word;position:relative}
.message-bubble .bubble-text{font-size:15px;line-height:1.6}
.message-row.user .message-bubble{border-color:rgba(88,169,220,.52);border-radius:22px 22px 7px 22px;background:#e8f5ff}
.message-bubble time{display:block;margin-top:4px;text-align:right;color:#a68d82;font-size:11px}
/* 消息列表容器 */
#messageList{width:100%}

/* ---- Animations ---- */
@keyframes bubbleIn{from{opacity:0;transform:translateY(14px) scale(0.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.message-row{animation:bubbleIn .35s ease-out}

/* ---- Typing ---- */
.typing-dots{display:flex;gap:5px;padding:4px 2px}
.typing-dots span{width:7px;height:7px;background:#c09080;border-radius:50%;animation:dotBounce 1.3s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.18s}
.typing-dots span:nth-child(3){animation-delay:.36s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.5);opacity:.35}40%{transform:scale(1);opacity:1}}

/* ---- Speak button — 放在气泡外面 ---- */
.speak-btn{width:30px;height:30px;flex:0 0 auto;display:none;align-items:center;justify-content:center;border:none;border-radius:50%;background:rgba(255,248,240,.85);color:#a07060;cursor:pointer;transition:all .2s;padding:0}
.message-row:hover .speak-btn,.speak-btn.playing{display:flex}
.speak-btn:hover{background:#fff0e6;color:var(--orange)}
.speak-btn.playing{display:flex;color:var(--orange);background:#fff0e6}
.speak-btn svg{width:13px;height:13px}

/* ---- Composer ---- */
.composer-wrap{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 36px 20px;background:linear-gradient(180deg,rgba(255,253,249,0),rgba(255,253,249,.88) 24%,rgba(255,253,249,.99) 52%)}
.quick-replies{display:flex;justify-content:center;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.quick-replies::-webkit-scrollbar{display:none}
.quick-replies button{min-height:35px;flex:0 0 auto;padding:0 15px;border:1px solid rgba(130,94,76,.18);border-radius:999px;color:#8d6d60;background:#fffdfa;cursor:pointer;font-size:14px}
.quick-replies button:hover{background:#fff4ea}
.composer{min-height:70px;display:grid;grid-template-columns:32px minmax(0,1fr) auto 50px;align-items:center;gap:10px;padding:10px 10px 10px 20px;border:2px solid rgba(244,151,108,.45);border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 14px 34px rgba(102,66,45,.10)}
.composer:focus-within{border-color:rgba(255,118,64,.55);box-shadow:0 14px 38px rgba(102,66,45,.15)}
.composer .btn-mic{width:32px;height:32px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#b8a898;transition:color .25s}
.composer .btn-mic img{width:24px;height:24px}
.composer .btn-mic:hover{color:var(--orange)}
.composer .btn-mic.listening{color:#e04040;animation:micPulse 1s infinite}
.composer .btn-mic.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.composer textarea{min-width:0;max-height:110px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;font-size:16px;line-height:1.45;color:var(--brown);font-family:inherit}
.composer textarea::placeholder{color:#9b8f8c}
.character-count{color:#a58b7f;font-size:12px;white-space:nowrap}
.send-button{width:50px;height:50px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:transform .15s}
.send-button:hover{transform:scale(1.06)}
.send-button img{width:50px;height:50px}
.send-button:disabled{opacity:.4;cursor:not-allowed}

/* ---- Roadmap Panel ---- */
.roadmap-panel{min-width:0;overflow:hidden;border-left:1px solid var(--line);background:rgba(255,249,243,.95)}
.roadmap-panel h2{margin:17px 0 12px;text-align:center;color:#a88a7a;font-size:14px;font-weight:700}
.roadmap-list{height:calc(100% - 48px);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:8px 8px 15px}
.roadmap-step{width:100%;position:relative;display:grid;justify-items:center;gap:7px;padding:7px 3px;border:0;background:transparent;color:#aa958b;cursor:pointer;transition:color .3s}
.roadmap-step:not(:last-child)::after{content:"";width:5px;height:32px;position:absolute;left:calc(50% - 2.5px);top:calc(100% - 3px);border-radius:999px;background:linear-gradient(#f2c7c1,#d3b8e9,#badba6);opacity:.75}
.roadmap-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.72)}
.roadmap-icon img{width:38px;height:38px}
.roadmap-step strong{font-size:12px;font-weight:700}
.roadmap-step.lit{color:#d94821}
.roadmap-step.lit .roadmap-icon{background:#fff0e6;box-shadow:var(--soft)}

/* ---- Modals ---- */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(63,51,45,.44);backdrop-filter:blur(7px)}.modal-backdrop.hidden{display:none}
.modal-card{width:min(720px,100%);position:relative;padding:42px 38px 36px;border:2px solid rgba(255,255,255,.90);border-radius:34px;text-align:center;background:#fffdf9;box-shadow:0 28px 86px rgba(44,31,25,.26)}
.modal-close{width:42px;height:42px;position:absolute;right:20px;top:18px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;color:#a09080}
.modal-close:hover{border-color:#d94821;color:#d94821}
.modal-sticker{font-size:46px}
.modal-card h2{margin:11px 0 8px;font-size:29px;font-weight:950;color:var(--brown)}
.modal-card>p{margin:0;color:var(--brown2);line-height:1.7;font-size:15px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.mood-grid button{min-height:78px;padding:10px;border:1px solid var(--line);border-radius:21px;background:#fff9f4;font-weight:850;cursor:pointer;font-size:16px;color:var(--brown)}
.mood-grid button:hover{border-color:rgba(255,118,64,.50);background:#fff1e7}
.mood-grid button.selected{border-color:rgba(255,118,64,.60);background:#fff1e7;box-shadow:0 6px 18px rgba(255,118,64,.15)}

/* ---- Weather badge ---- */
.weather-badge{display:inline-flex;align-items:center;margin-left:2px}
.weather-badge svg{stroke:#587594}

/* ===== Responsive ===== */
@media(max-width:1500px){.topbar{grid-template-columns:240px minmax(0,1fr) auto}.workspace{grid-template-columns:280px minmax(440px,1fr) 95px}.top-button{min-height:38px;padding:0 12px;font-size:13px}.messages{padding-inline:28px}.composer-wrap{padding-inline:28px}}
@media(max-width:1180px){.topbar{grid-template-columns:200px minmax(0,1fr) auto}.workspace{grid-template-columns:240px minmax(380px,1fr) 85px}.top-actions{gap:5px;padding-inline:6px}.top-button span{display:none}.top-button{width:38px;min-height:38px;padding:0}.messages{padding-inline:20px}.composer-wrap{padding-inline:20px}.message-bubble{max-width:min(420px,62%)}.mood-grid{grid-template-columns:repeat(2,1fr)}.mood-grid button{min-height:64px}}
@media(max-width:900px){
  body{overflow:auto}.app-shell{min-height:100vh;height:auto;padding:0}.app-frame{min-height:100vh;height:auto;border-radius:0}.topbar{height:auto;grid-template-columns:1fr auto;padding:10px 12px}.brand{padding:0}.page-title{display:none}
  .workspace{min-height:calc(100vh - 76px);height:auto;grid-template-columns:1fr}.history-panel{width:min(390px,88vw);position:fixed;z-index:50;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s;box-shadow:18px 0 45px rgba(52,38,31,.17)}.history-panel.open{transform:translateX(0)}.roadmap-panel{display:none}
  .main-panel{min-height:calc(100vh - 76px)}.messages{padding:24px 16px 195px}.message-bubble{max-width:calc(100% - 67px)}.composer-wrap{padding:0 14px 16px}.quick-replies{justify-content:flex-start}.composer{grid-template-columns:28px minmax(0,1fr) 46px;min-height:64px;padding-left:15px}.character-count{display:none}.send-button,.send-button img{width:46px;height:46px}
}
@media(max-width:560px){.brand strong{display:none}.brand-logo{width:43px;height:43px}.brand-logo img{width:41px;height:41px}.top-actions{gap:4px}.top-button{width:36px;min-height:36px}.top-button img{width:20px;height:20px}.message-avatar{width:42px;height:42px}.message-avatar img{width:52px;height:52px}.message-avatar.student{width:46px;height:46px}.message-avatar.student img{width:42px;height:49px}.message-bubble{padding:13px 14px;border-radius:18px 18px 18px 6px}.message-bubble .bubble-text{font-size:13px}.message-row.user .message-bubble{border-radius:18px 18px 6px 18px}.mood-grid{grid-template-columns:1fr 1fr}.modal-card{padding-inline:20px}}
  </style>

</head>

  <div class="app-shell">

	    <!-- Topbar -->
	    <header class="topbar">

	        <strong>小新</strong>
	      </a>
	      <div class="page-title">
	        <img src="assets/icons/chat.svg" alt="">
	        <strong>和小新聊天</strong>
	        <span class="weather-badge" id="weatherBadge" title="心情气象站"></span>
	      </div>
	      <nav class="top-actions">
	        <button class="top-button" id="historyToggle" type="button">
	          <img src="assets/icons/history.svg" alt=""><span>历史</span>
	        </button>
	        <button class="top-button" id="btnPinyin" type="button"><span>拼</span></button>
	        <button class="top-button" id="moodButton" type="button">
	          <img src="assets/icons/mood.svg" alt=""><span>选择心情</span>
	        </button>
	        <a class="top-button" href="/home.html">
	          <img src="assets/icons/home.svg" alt=""><span>返回首页</span>

	        <button class="top-button danger" id="btnEnd" type="button">
	          <img src="assets/icons/end.svg" alt=""><span>结束聊天</span>
	        </button>
	      </nav>
	    </header>

    <!-- Workspace -->
    <div class="workspace">

      <!-- History Panel -->
      <aside class="history-panel" id="historySidebar">
        <div class="history-inner">
          <h2 class="history-title">
            <img src="assets/icons/clock.svg" alt=""><span>历史对话</span>
          </h2>
          <label class="search-box">
            <img src="assets/icons/search.svg" alt="">
            <input id="historySearch" type="search" placeholder="搜索对话内容……">
          </label>
          <div class="history-list" id="historyList">
            <div class="empty-history">加载中...</div>
          </div>
        </div>
      </aside>

      <!-- Main Panel — 纯聊天区，无 hero -->
      <section class="main-panel">
        <section class="chat-section">
          <img class="chat-bg" src="assets/backgrounds/chat-grid-clean.svg" alt="">
          <div class="messages" id="chatMessages">
            <div id="messageList"></div>
          </div>
          <footer class="composer-wrap">
            <div class="quick-replies" id="quickReplies"></div>
            <div class="composer" id="inputArea">
              <button class="btn-mic" id="btnMic" title="语音输入">
                <img src="assets/icons/microphone.svg" alt="">
              </button>
              <textarea id="msgInput" maxlength="2000" rows="1" placeholder="继续和小新聊一聊……（最多 2000 个字符）" autocomplete="off"></textarea>
              <span class="character-count" id="charCount">0 / 2000</span>
              <button class="send-button" id="btnSend" type="button" aria-label="发送消息">
                <img src="assets/icons/send.svg" alt="">
              </button>

          </footer>
        </section>
      </section>

      <!-- Roadmap Panel -->
      <aside class="roadmap-panel" id="exploreMap">

          <button class="roadmap-step" data-cat="daily"><span class="roadmap-icon"><img src="assets/icons/daily.svg" alt=""></span><strong>日常</strong></button>
          <button class="roadmap-step" data-cat="sports"><span class="roadmap-icon"><img src="assets/icons/sports.svg" alt=""></span><strong>运动</strong></button>
          <button class="roadmap-step" data-cat="study"><span class="roadmap-icon"><img src="assets/icons/study.svg" alt=""></span><strong>学习</strong></button>
          <button class="roadmap-step" data-cat="emotion"><span class="roadmap-icon"><img src="assets/icons/emotion.svg" alt=""></span><strong>情绪</strong></button>
          <button class="roadmap-step" data-cat="hobby"><span class="roadmap-icon"><img src="assets/icons/interest.svg" alt=""></span><strong>兴趣</strong></button>
          <button class="roadmap-step" data-cat="social"><span class="roadmap-icon"><img src="assets/icons/social.svg" alt=""></span><strong>社交</strong></button>
        </nav>
      </aside>
    </div>

   </main>
  </div>

  <!-- Mood Modal -->
  <div class="modal-backdrop hidden" id="weatherOverlay">
    <section class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="btnWeatherClose" type="button">&times;</button>
      <div class="modal-sticker">🌦️</div>

        <button data-weather="storm" data-label="雷阵雨">⛈️ 十分烦躁</button>
        <button data-weather="rainbow" data-label="彩虹">🌈 开心到发光</button>
        <button data-weather="breeze" data-label="微风">🍃 轻松自在</button>
        <button data-weather="lightrain" data-label="小雨">🌧️ 有点小难过</button>
        <button data-weather="custom" data-label="自定义">🌀 说不清</button>
      </div>
    </section>
  </div>

var WEATHER_WELCOME_MAP={sunny:['今天感觉超晴朗呀！有什么开心的事想和小新分享吗？','心情这么好，是发生什么好事了吗？','阳光灿烂的一天，有什么想聊的？'],cloudy:['今天心情有点沉闷呀，想跟小新说说是怎么回事吗？','感觉你今天不太提得起劲，发生什么了呀？','有点闷闷的对不对，说出来会不会好一点？'],storm:['感觉你现在有点烦躁，是遇到什么让你不开心的事了吗？','心里有点乱？没关系，慢慢说给小新听。','看起来今天不太顺，想吐槽点什么吗？'],rainbow:['哇，开心到发光！是有什么超棒的事发生了吗？','感觉你今天状态特别好呀，快说说是什么好事！','这么开心，一定要和小新分享一下！'],breeze:['今天感觉很轻松自在呢，有什么想聊的吗？','状态挺放松的呀，最近在做什么呢？','轻松惬意的一天，有什么想和小新说说的？'],lightrain:['感觉你有点小难过，愿意和小新说说发生什么了吗？','心情不太好对不对，小新在这里听你说。','有点低落？没事的，想聊聊吗？'],custom:['今天心情有点特别呢，想跟小新说说是什么感觉吗？','说不清今天是什么心情？那正好和小新聊聊看。']};
function getWeatherWelcome(w){var p=WEATHER_WELCOME_MAP[w]||WEATHER_WELCOME_MAP.custom;return p[Math.floor(Math.random()*p.length)]}
function escapeHTML(s){if(s==null)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===== DOM =====
var chatMessages=document.getElementById('chatMessages'),messageList=document.getElementById('messageList'),msgInput=document.getElementById('msgInput'),btnSend=document.getElementById('btnSend'),btnEnd=document.getElementById('btnEnd'),btnMic=document.getElementById('btnMic'),quickReplies=document.getElementById('quickReplies'),weatherBadge=document.getElementById('weatherBadge'),weatherOverlay=document.getElementById('weatherOverlay'),weatherOptions=document.getElementById('weatherOptions'),btnWeatherClose=document.getElementById('btnWeatherClose'),exploreMap=document.getElementById('exploreMap'),historySidebar=document.getElementById('historySidebar'),historyList=document.getElementById('historyList'),historyToggle=document.getElementById('historyToggle'),moodButton=document.getElementById('moodButton'),btnPinyin=document.getElementById('btnPinyin'),historySearch=document.getElementById('historySearch'),charCount=document.getElementById('charCount'),brandLogoImg=document.getElementById('brandLogoImg');

// ===== Init brand logo =====
if(brandLogoImg&&window.getXiaoxinLogo){brandLogoImg.src=window.getXiaoxinLogo();brandLogoImg.onerror=function(){brandLogoImg.src='assets/characters/xiaoxin-logo.png'}}

// ===== History sidebar =====
var sidebarOpen=false;
historyToggle.addEventListener('click',function(){if(sidebarOpen){historySidebar.classList.remove('open');sidebarOpen=false}else{historySidebar.classList.add('open');sidebarOpen=true;loadHistoryList()}});
loadHistoryList();
if(historySearch){historySearch.addEventListener('input',function(){var q=this.value.toLowerCase().trim();historyList.querySelectorAll('.history-card').forEach(function(c){var ds=(c.dataset.search||'').toLowerCase();if(!q||ds.indexOf(q)>=0)c.removeAttribute('hidden');else c.setAttribute('hidden','')})})}

async function loadHistoryList(){
  try{
    var r=await fetch('/api/history'),d=await r.json();
    if(!Array.isArray(d)||d.length===0){historyList.innerHTML='<div class="empty-history">还没有历史对话</div>';return}
    historyList.innerHTML=d.reverse().map(function(h){
      var dt=new Date(h.startTime);
      var ds=(dt.getMonth()+1)+'月'+dt.getDate()+'日 '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
      var wl=h.weather?' · '+h.weather:'';
      var done=h.completed!==false;
      var badge=done?'':' <span style="color:#d94821;font-size:10px;">●未结束</span>';
      return '<button class="history-card" data-id="'+h.id+'" data-search="'+(h.preview||'')+'"><strong>'+escapeHTML(h.preview||'(空对话)')+'</strong><small>'+ds+wl+'</small><em>'+badge+'</em><span class="hi-del" data-del="'+h.id+'" title="删除">&times;</span></button>';
    }).join('');
    historyList.querySelectorAll('.hi-del').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();if(!confirm('确定要删除这条历史对话吗？'))return;var id=this.dataset.del;fetch('/api/history/'+id,{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){if(d.ok)loadHistoryList()})})});
    historyList.querySelectorAll('.history-card').forEach(function(c){c.addEventListener('click',function(e){if(e.target.closest('.hi-del'))return;continueFromHistory(this.dataset.id)})});
  }catch(_){historyList.innerHTML='<div class="empty-history">加载失败</div>'}
}

async function continueFromHistory(id){
  try{
    var r=await fetch('/api/history/'+id),d=await r.json();
    if(!d||!d.messages)return;
    messages=d.messages.map(function(m){return{role:m.role,content:m.content}});
    turnCount=d.turnCount||messages.filter(function(m){return m.role==='user'}).length;
    await fetch('/api/session/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,messages:messages})});
    messageList.innerHTML='';
    messages.forEach(function(m){addBubble(m.role,m.content)});
    refreshQuickTopics();
    historySidebar.classList.remove('open');sidebarOpen=false;
  }catch(_){alert('加载历史对话失败')}
}

// ===== 心情选择会话标记（按对话 ID 关联，刷新不丢失） =====
// chatKey 是一个稳定的对话标识：首次进入 chat.html 时生成，刷新保持不变，
// 仅在"全新对话"（分支4）时重新生成。这样 wasWeatherChosen() 始终反映
// "当前这个对话"是否已选择心情，不受其他对话或页面刷新影响。
var CHAT_KEY='xiaoxin_chat_key';
function getChatKey(){var k=sessionStorage.getItem(CHAT_KEY);if(!k){k='chat-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);sessionStorage.setItem(CHAT_KEY,k)}return k}
function newChatKey(){var k='chat-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);sessionStorage.setItem(CHAT_KEY,k);return k}
var WEATHER_CHOSEN_PREFIX='xiaoxin_weather_chosen_';
function markWeatherChosen(){sessionStorage.setItem(WEATHER_CHOSEN_PREFIX+getChatKey(),'1')}
function wasWeatherChosen(){return sessionStorage.getItem(WEATHER_CHOSEN_PREFIX+getChatKey())==='1'}

// ===== Resume init =====
// 通用的消息恢复函数：从数据对象渲染聊天界面
function tryRestoreMessages(data){
  if(!data||!data.messages||data.messages.length===0)return false;
  messages=data.messages.map(function(m){return{role:m.role,content:m.content||''}});
  turnCount=data.turnCount||messages.filter(function(m){return m.role==='user'}).length;
  selectedWeather=data.weather||null;weatherLabel=data.weatherLabel||data.weather||null;
  if(selectedWeather){weatherBadge.innerHTML=makeBadgeSVG(selectedWeather);markWeatherChosen()}
  messageList.innerHTML='';
  messages.forEach(function(m){addBubble(m.role,m.content)});
  weatherOverlay.classList.add('hidden');
  // 恢复后显示随机话题
  refreshQuickTopics();
  msgInput.focus();
  return true;
}

// ===== 快捷话题静态池 — 必须在 IIFE 之前定义，否则同步分支中会读到 undefined =====
var QUICK_REPLY_POOL=['放学路上的奇遇','今天最离谱的作业','最近超爱的一首歌','体育课上的搞笑瞬间','最近追的一部动画','家里宠物的迷惑行为','周末最想做的事','最近发现的新零食','今天食堂的菜怎么样','最近和同桌的趣事','有没有什么想吐槽的','如果明天放假你想干嘛'];

(async function(){
  // 分支 1：从历史记录链接进入（带 convId）→ 加载指定历史对话
  if(resumingConvId){
    weatherOverlay.classList.add('hidden');
    try{
      var r=await fetch('/api/history/'+resumingConvId),d=await r.json();
      if(tryRestoreMessages(d)){
        // 把历史消息同步到新的 session，确保后续对话保存在新 session 下
        await fetch('/api/session/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,messages:messages})});
        return;
      }
    }catch(_){}
    // convId 恢复失败 → 降级为新对话
  }

  // 分支 1.5：从首页"和小新聊聊天"进入（URL 带 ?new=1）→ 强制全新对话
  var isNewChat = urlParams.get('new') === '1';
  if (isNewChat && !resumingConvId) {
    // 清理 URL，移除 new 参数（避免刷新时重复触发）
    if (history.replaceState) history.replaceState(null, '', location.pathname);
    // 强制全新对话：清除所有旧状态，展示心情卡片
    newChatKey();
    sessionStorage.removeItem('xiaoxin_msg_backup');
    sessionStorage.removeItem('xiaoxin_weather_chosen');
    sessionStorage.removeItem('xiaoxin_weather_selected');
    sessionStorage.removeItem('xiaoxin_weather_label');
    sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
    sessionStorage.removeItem('xiaoxin_is_continue');
    sessionStorage.removeItem('xiaoxin_quick_topics_cache');
    sessionStorage.setItem(XIAOXIN_ACTIVE_SESSION_KEY, sessionId);
    weatherOverlay.classList.remove('hidden');
    return;
  }

  var isContinue = sessionStorage.getItem('xiaoxin_is_continue')==='1';
  var isFinalized = sessionStorage.getItem(XIAOXIN_SESSION_FINALIZED_KEY)==='1';
  var hasActiveSession = !!sessionStorage.getItem(XIAOXIN_ACTIVE_SESSION_KEY);
  var backupRaw = sessionStorage.getItem('xiaoxin_msg_backup');
  var hasBackup = !!backupRaw;

  // 分支 2："继续和小新聊天"按钮 → 恢复消息 + 心情 + 衔接语
  if(!resumingConvId && isContinue){
    sessionStorage.removeItem('xiaoxin_is_continue');
    sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
    // 恢复历史消息
    if(hasBackup){
      try{
        var _bd=JSON.parse(backupRaw);
        if(_bd.messages && _bd.messages.length>0){
          messages=_bd.messages.map(function(m){return{role:m.role,content:m.content||''}});
          turnCount=_bd.turnCount||messages.filter(function(m){return m.role==='user'}).length;
          messageList.innerHTML='';
          messages.forEach(function(m){addBubble(m.role,m.content)});
        }
      }catch(_){}
    }
    // 恢复心情
    if(wasWeatherChosen()){
      selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
      weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
      if(selectedWeather){
        var _icon1=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
        weatherBadge.innerHTML=makeBadgeSVG(_icon1);
      }
    }
    weatherOverlay.classList.add('hidden');
    // 追加衔接语
    var _contMsg='我们继续聊吧～刚才说到哪儿啦？';
    addBubble('assistant',_contMsg);messages.push({role:'assistant',content:_contMsg});
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 3：已有活跃会话且未结束 → F5 刷新恢复（不弹心情卡片）
  if(!resumingConvId && !isFinalized && hasActiveSession && hasBackup){
    try{
      var _bd2=JSON.parse(backupRaw);
      if(_bd2.messages && _bd2.messages.length>0){
        messages=_bd2.messages.map(function(m){return{role:m.role,content:m.content||''}});
        turnCount=_bd2.turnCount||messages.filter(function(m){return m.role==='user'}).length;
        messageList.innerHTML='';
        messages.forEach(function(m){addBubble(m.role,m.content)});
      }
    }catch(_){}
    // 恢复心情
    if(wasWeatherChosen()){
      selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
      weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
      if(selectedWeather){
        var _icon2=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
        weatherBadge.innerHTML=makeBadgeSVG(_icon2);
      }
    }
    weatherOverlay.classList.add('hidden');
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 3.6：已选过心情但尚无备份消息（刚选完心情就刷新 / 边缘情况）— 跳过心情选择
  if(!resumingConvId && hasActiveSession && wasWeatherChosen() && !hasBackup){
    selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
    weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
    if(selectedWeather){
      var _icon36=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
      weatherBadge.innerHTML=makeBadgeSVG(_icon36);
    }
    weatherOverlay.classList.add('hidden');
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 4：全新对话 — 清除旧数据，展示心情选择卡片
  // 生成全新 chatKey，使心情标记与这个新对话关联（旧对话的心情状态不再影响新对话）
  newChatKey();
  sessionStorage.removeItem('xiaoxin_msg_backup');
  sessionStorage.removeItem('xiaoxin_weather_chosen'); // 兼容旧版全局标记
  sessionStorage.removeItem('xiaoxin_weather_selected');
  sessionStorage.removeItem('xiaoxin_weather_label');
  sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
  sessionStorage.removeItem('xiaoxin_is_continue');
  sessionStorage.removeItem('xiaoxin_quick_topics_cache');
  // 写入新的稳定会话标识（值为当前 sessionId，仅用作"是否存在"的标记）
  sessionStorage.setItem(XIAOXIN_ACTIVE_SESSION_KEY,sessionId);
  // 新对话 + 未选心情 → 展示心情卡片
  weatherOverlay.classList.remove('hidden');
})();

var WEATHER_KEYWORD_MAP=[{keywords:['暴风雨','台风','飓风','龙卷风','狂风','雷暴'],icon:'storm'},{keywords:['彩虹','虹'],icon:'rainbow'},{keywords:['大风','风','刮风','吹风','微风','秋风','春风'],icon:'breeze'},{keywords:['小雨','下雨','雨','雨天','暴雨','大雨','中雨','雷阵雨','毛毛雨'],icon:'lightrain'},{keywords:['雪','下雪','雪花','大雪','小雪','冷','寒冷','冰','冻'],icon:'snow'},{keywords:['雾','雾霾','大雾','霾','朦胧'],icon:'fog'},{keywords:['月亮','夜晚','晚上','安静','宁静','困','累','疲惫','深夜','失眠'],icon:'moon'},{keywords:['晴天','晴','太阳','阳光','大太阳'],icon:'sunny'},{keywords:['多云','阴天','阴','云'],icon:'cloudy'},{keywords:['热','炎热','高温','酷暑','闷热','火'],icon:'sunny'}];
function matchWeatherIcon(t){for(var i=0;i<WEATHER_KEYWORD_MAP.length;i++){for(var j=0;j<WEATHER_KEYWORD_MAP[i].keywords.length;j++){if(t.indexOf(WEATHER_KEYWORD_MAP[i].keywords[j])>=0)return WEATHER_KEYWORD_MAP[i].icon}}return'sparkle'}

function applyWeather(w,l){
  selectedWeather=w;weatherLabel=l||w;
  markWeatherChosen();

  sessionStorage.setItem('xiaoxin_weather_label',l||w);

// ===== Quick replies =====
function normalizeTopicItem(item){if(typeof item==='string')return item;if(item&&typeof item==='object')return item.text||item.content||item.title||item.label||item.topic||'';return''}
function showQuickReplies(topicList){
  // 话题永远不消失 — 无论刷新、新建聊天还是继续聊天
  var src=(Array.isArray(topicList)&&topicList.length>=2)?topicList:null;
  var picked=[];
  if(src){
    var arr=[].concat(src);
    while(arr.length>0&&picked.length<3){
      var idx=Math.floor(Math.random()*arr.length);
      var raw=arr.splice(idx,1)[0];
      var txt=normalizeTopicItem(raw);
      if(txt)picked.push(txt);
    }
    // 如果有效话题不够3个，用固定池补足
    if(picked.length<3){
      var pool=[].concat(QUICK_REPLY_POOL);
      while(picked.length<3&&pool.length>0){
        var ri=Math.floor(Math.random()*pool.length);
        picked.push(pool.splice(ri,1)[0]);
      }
    }
  }else{
    var p=[].concat(QUICK_REPLY_POOL);
    for(var i=0;i<3&&p.length>0;i++){
      var idx2=Math.floor(Math.random()*p.length);
      picked.push(p.splice(idx2,1)[0]);
    }
  }
  // 过滤掉可能的空字符串/undefined
  picked=picked.filter(function(v){return v&&String(v).trim()});
  if(!quickReplies)return;
  quickReplies.innerHTML=picked.map(function(v){return'<button type="button">'+v+'</button>'}).join('');
  quickReplies.querySelectorAll('button').forEach(function(ch,idx){
    var topicText=picked[idx];
    ch.addEventListener('click',function(){
      if(!topicText)return;
      msgInput.value=topicText;
      sendMessage();
    });
  });
}

// ===== 动态话题生成（DeepSeek API）+ sessionStorage 缓存 =====
var quickTopicsLoading=false;
var QUICK_TOPICS_CACHE_KEY='xiaoxin_quick_topics_cache';

// 从 sessionStorage 读取缓存的话题（页面刷新后仍可用）
function loadCachedTopics(){
  try{
    var raw=sessionStorage.getItem(QUICK_TOPICS_CACHE_KEY);
    if(!raw)return null;
    var cache=JSON.parse(raw);
    if(cache&&Array.isArray(cache.topics)&&cache.topics.length>=2)return cache.topics;
  }catch(_){}
  return null;
}

// 将 AI 话题写入 sessionStorage 缓存
function saveCachedTopics(topics){
  try{
    sessionStorage.setItem(QUICK_TOPICS_CACHE_KEY,JSON.stringify({topics:topics,ts:Date.now()}));
  }catch(_){}
}

async function fetchQuickTopics(){
  if(quickTopicsLoading)return[];  // 防止并发请求
  quickTopicsLoading=true;
  try{
    var recentMsgs=messages.slice(-6);  // 最近6条消息（约3轮问答）
    var r=await fetch('/api/quick-topics',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({recentMessages:recentMsgs})
    });
    var d=await r.json();
    if(d&&Array.isArray(d.topics)&&d.topics.length>=2){
      saveCachedTopics(d.topics);  // 成功则缓存
      return d.topics;
    }
    return[];
  }catch(_){return[]}
  finally{quickTopicsLoading=false}
}

async function refreshQuickTopics(){
  // 策略：话题永远不消失（刷新/新建/继续聊天后始终可见）
  // 1. 立即展示：优先缓存 → 静态池，确保刷新后不会空白
  // 2. 异步拉取 AI 话题，成功后替换并更新缓存

  // 第一步：立即渲染（同步），确保页面不空白
  var cached=loadCachedTopics();
  if(cached){
    showQuickReplies(cached);
  }else{
    showQuickReplies(); // 展示静态池兜底
  }

  // 第二步：异步拉取 AI 话题，成功后替换
  var topics=await fetchQuickTopics();
  if(topics.length>=2){
    showQuickReplies(topics);
  }
  // 如果 AI 失败：缓存或静态池已经在上方渲染，保持不变即可
}

function addBubble(role,content){
  if(content==null)return;
  var row=document.createElement('div');row.className='message-row '+(role==='user'?'user':'assistant');
  if(role==='assistant')row.innerHTML=getAvatarHTML('assistant');
  var b=document.createElement('div');b.className='message-bubble';
  b.innerHTML='<span class="bubble-text">'+escapeHTML(content)+'</span>';
  var n=new Date(),ts=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  var t=document.createElement('time');t.textContent=ts;b.appendChild(t);
  row.appendChild(b);
  // 喇叭放在气泡外面——不占气泡高度
  if(role==='assistant'){
    var spk=document.createElement('button');spk.className='speak-btn';spk.title='朗读';
    spk.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>';
    spk.addEventListener('click',function(e){e.stopPropagation();if(spk.classList.contains('playing')){xfTtsController.stop();spk.classList.remove('playing');return}document.querySelectorAll('.speak-btn.playing').forEach(function(x){x.classList.remove('playing')});xfTtsController.speak(content,spk)});
    row.appendChild(spk);
  }
  if(role==='user')row.innerHTML+=getAvatarHTML('user');
  messageList.appendChild(row);row.scrollIntoView({block:'end',behavior:'instant'});return row;
}

// ===== Auto-save =====
// 新对话不再附加 convId，确保每次新建的对话都作为独立记录保存
function autoSave(){if(messages.length===0)return;var b={sessionId:sessionId,messages:messages,turnCount:turnCount,weather:weatherLabel};try{sessionStorage.setItem('xiaoxin_msg_backup',JSON.stringify({messages:messages,turnCount:turnCount,weather:weatherLabel}))}catch(_){}fetch('/api/history/auto-save',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).catch(function(){})}

// ===== Send message =====
async function sendMessage(){
  var text=msgInput.value.trim();if(!text||isLoading)return;
  var prevLen=messages.length,prevTurn=turnCount,prevShort=consecutiveShortCount,submittedText=text,submittedBubble=null;
  isLoading=true;msgInput.value='';autoResize();updateCharCount();
  submittedBubble=addBubble('user',text);turnCount++;messages.push({role:'user',content:text});
  if(text.length<5)consecutiveShortCount++;else consecutiveShortCount=0;
  updateRoadmap();btnSend.disabled=true;showTyping();
  function rollback(){if(submittedBubble&&submittedBubble.isConnected)submittedBubble.remove();messages.length=prevLen;turnCount=prevTurn;consecutiveShortCount=prevShort;if(!msgInput.value)msgInput.value=submittedText;updateCharCount();autoResize()}
  try{
    var r=await fetch('/chat/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,message:text})});
    var d=await r.json();removeTyping();
    if(!r.ok){rollback();var et='小新暂时无法回应，请稍后重试';switch(d.error){case'MESSAGE_EMPTY':et='消息不能为空';break;case'MESSAGE_TOO_LONG':et='消息过长，请精简到 2000 个字符以内';break;case'PAYLOAD_TOO_LARGE':et='发送内容过大，请精简后重试';break;case'INVALID_REQUEST':case'INVALID_JSON':et='消息格式不正确，请重新输入';break}addBubble('assistant',et);isLoading=false;btnSend.disabled=false;msgInput.focus();return}
    if(d.reply){addBubble('assistant',d.reply);messages.push({role:'assistant',content:d.reply});refreshQuickTopics()}else addBubble('assistant','(小新好像走神了，再试一次？)');
    if(d.imageUrl){var ir=document.createElement('div');ir.className='message-row assistant';ir.innerHTML=getAvatarHTML('assistant');var ib=document.createElement('div');ib.className='message-bubble';ib.style.textAlign='center';ib.innerHTML='<span class="bubble-text">🎨 今天聊的这几件事我都画下来啦～<br><span style="font-size:11px;color:#a09080;">画面正在生成中...</span></span>';ir.appendChild(ib);messageList.appendChild(ir);chatMessages.scrollTop=chatMessages.scrollHeight;var img=new Image();img.onload=function(){ib.innerHTML='<span class="bubble-text">今天聊的这几件事我都画下来啦，随时可以去手账本翻一翻哦～</span><br><img src="'+d.imageUrl+'" alt="配图" style="width:100%;max-width:360px;border-radius:12px;display:block;margin:8px auto 0;"><span style="font-size:11px;color:#a09080;">以后随时可以去手账本里再看到它哦</span>';chatMessages.scrollTop=chatMessages.scrollHeight};img.onerror=function(){ib.innerHTML='<span class="bubble-text">我把今天画下来啦～<br><span style="font-size:11px;color:#a09080;">(画面还在路上，稍后再来手账本看看吧)</span></span>'};img.src=d.imageUrl}
    autoSave();
  }catch(err){console.error('[sendMessage] 错误:',err);removeTyping();rollback();addBubble('assistant','(网络好像不太稳定，检查一下服务器吧)')}
  isLoading=false;btnSend.disabled=false;msgInput.focus();
}
btnSend.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});

// ===== Textarea =====
function autoResize(){msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,110)+'px'}
function updateCharCount(){charCount.textContent=msgInput.value.length+' / 2000'}

async function finalizeConversation(){if(turnCount===0||finalized)return;finalized=true;sessionStorage.setItem(XIAOXIN_SESSION_FINALIZED_KEY,'1');var b={sessionId:sessionId,messages:messages,turnCount:turnCount,weather:selectedWeather,weatherLabel:weatherLabel,completed:true};try{await fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}catch(e){}}
function buildEndUrl(){
  var params=new URLSearchParams();
  params.set('turns',turnCount);
  params.set('msgs',messages.length);
  if(selectedWeather)params.set('weather',selectedWeather);
  if(weatherLabel)params.set('weatherLabel',weatherLabel);
  params.set('sessionId',sessionId);
  return '/chat-end.html?'+params.toString();
}
btnEnd.addEventListener('click',async function(){
  if(turnCount>0)await finalizeConversation();
  // 跳转到独立的结束页面，URL 不同 → 刷新也不丢状态
  location.href=buildEndUrl();
});
