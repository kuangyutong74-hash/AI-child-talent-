<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 伯乐 · 探索空间</title>
<link rel="stylesheet" href="/css/common.css">
<style>
/* ==========================================
   Page: Index — AI 伯乐 · 探索空间
   3D 黏土书桌背景 + 毛玻璃卡片
   ========================================== */

body {
  display: flex; align-items: center; justify-content: center;
}

/* 弥散光点装饰 — 保留但降低强度避免遮挡背景 */
.bg-dot {
  position: absolute; border-radius: 50%; z-index: 0;
  filter: blur(90px); opacity: 0.18; pointer-events: none;
}
.bg-dot.a { width: 280px; height: 280px; background: #f5d0b0; top: -80px; left: -60px; }
.bg-dot.b { width: 220px; height: 220px; background: #c8dcf4; bottom: -60px; right: -40px; }
.bg-dot.c { width: 160px; height: 160px; background: #e4cef4; top: 55%; left: 62%; }
.bg-dot.d { width: 120px; height: 120px; background: #fce0c8; top: 12%; right: 15%; opacity: 0.12; }

/* === 内容区 — 向右侧偏移，避开左下角望远镜/地球仪 === */
.page {
  width: 100%; max-width: 600px;
  padding: 60px 32px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 40px;
  position: relative; z-index: 1;
}

/* ===== 吉祥物 ===== */
.mascot-section {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.mascot-wrap {
  position: relative;
  width: 100px; height: 100px;
  animation: mascot-float 4s ease-in-out infinite;
}
@keyframes mascot-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}
.mascot-glow {
  position: absolute; top: 50%; left: 50%;
  width: 90px; height: 90px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,140,0.22) 0%, rgba(255,180,140,0) 70%);
  animation: glow-pulse 3s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
}
.sparkle {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: #ffc8a8;
  animation: sparkle-pop 2s ease-in-out infinite;
}
.sparkle.s1 { width: 6px; height: 6px; top: 8px; left: 10px; animation-delay: 0s; }
.sparkle.s2 { width: 4px; height: 4px; top: 15px; right: 8px; animation-delay: 0.5s; background: #ffddc0; }
.sparkle.s3 { width: 5px; height: 5px; bottom: 15px; left: 5px; animation-delay: 1.1s; background: #ffe0cc; }
.sparkle.s4 { width: 4px; height: 4px; bottom: 22px; right: 12px; animation-delay: 1.6s; }
.sparkle.s5 { width: 5px; height: 5px; top: 50%; left: -8px; animation-delay: 0.8s; background: #ffd4b8; }
@keyframes sparkle-pop {
  0%, 100% { transform: scale(1); opacity: 0.35; }
  50% { transform: scale(2.2); opacity: 1; }
}

/* ===== 标题区 ===== */
.hero { text-align: center; display: flex; flex-direction: column; gap: 8px; }
.hero .sub-icon { font-size: 22px; line-height: 1; opacity: 0.5; margin-bottom: 2px; }
.hero h1 { font-size: 26px; font-weight: 700; color: #3a1f14; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(255,255,255,0.6); }
.hero p  { font-size: 15px; color: #6b5040; line-height: 1.6; }

/* ===== 卡片 — 统一毛玻璃 ===== */
.cards { display: flex; gap: 24px; width: 100%; }
.card {
  flex: 1;
  /* === 毛玻璃核心 === */
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 24px;
  padding: 44px 24px 40px;
  text-align: center; cursor: pointer;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.5s ease, background 0.4s ease;
  text-decoration: none; color: var(--c-text);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  position: relative; overflow: visible;
  /* 立体弥散阴影 */
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
}

/* 学生卡片 — 暖橘粉微光 */
.card-student {
  box-shadow: 0 2px 8px rgba(255,145,110,0.06), 0 8px 32px rgba(255,145,110,0.12), 0 1px 3px rgba(0,0,0,0.04);
}
.card-student:hover {
  transform: translateY(-6px) scale(1.02);
  background: rgba(255,255,255,0.6);
  border-color: rgba(255,255,255,0.8);
  box-shadow: 0 4px 14px rgba(255,145,110,0.1), 0 14px 44px rgba(255,145,110,0.22), 0 2px 6px rgba(0,0,0,0.06);
}

/* 教师卡片 — 蓝紫微光 */
.card-teacher {
  box-shadow: 0 2px 8px rgba(135,165,235,0.06), 0 8px 32px rgba(135,165,235,0.12), 0 1px 3px rgba(0,0,0,0.04);
}
.card-teacher:hover {
  transform: translateY(-6px) scale(1.02);
  background: rgba(255,255,255,0.6);
  border-color: rgba(255,255,255,0.8);
  box-shadow: 0 4px 14px rgba(135,165,235,0.1), 0 14px 44px rgba(135,165,235,0.22), 0 2px 6px rgba(0,0,0,0.06);
}
.card:active { transform: translateY(-1px) scale(0.98); transition: transform 0.15s ease, box-shadow 0.15s ease; }

/* hover 涟漪 */
.card::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 0; height: 0; border-radius: 50%;
  background: rgba(216,90,48,0.03);
  transition: all 0.6s ease; transform: translate(-50%, -50%); z-index: 0;
}
.card:hover::after { width: 450px; height: 450px; }
.card > * { position: relative; z-index: 1; }

.card-icon {
  width: 90px; height: 90px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card-student .card-icon { background: rgba(135,195,225,0.18); }
.card-teacher .card-icon { background: rgba(165,200,160,0.18); }
.card:hover .card-icon { transform: scale(1.13); }

.card-title { font-size: 20px; font-weight: 700; color: #3e2a20; letter-spacing: 0.3px; }
.card-desc  { font-size: 13.5px; color: var(--c-text3); line-height: 1.6; max-width: 180px; }


/* ==========================================
   Responsive Breakpoints
   ========================================== */

/* Tablet: 768px – 1024px */
@media (max-width: 1024px) {
  .page { max-width: 520px; padding: 48px 24px 36px; gap: 32px; }
  .cards { gap: 18px; }
  .card { padding: 34px 18px 30px; gap: 12px; }
  .card-icon { width: 74px; height: 74px; font-size: 34px; }
  .card-title { font-size: 18px; }
  .card-desc { font-size: 13px; }
  .hero h1 { font-size: 23px; }
}

/* Mobile: ≤ 768px */
@media (max-width: 768px) {
  .page {
    max-width: 100%; padding: 32px 16px 28px; gap: 24px;
  }
  .mascot-wrap { width: 72px; height: 72px; }
  .cards { flex-direction: column; gap: 14px; }
  .hero h1 { font-size: 20px; }
  .hero p { font-size: 13px; }
  .card {
    padding: 28px 18px 24px; gap: 10px;
    border-radius: 20px;
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .card-icon { width: 60px; height: 60px; font-size: 30px; }
  .card-title { font-size: 17px; }
  .card-desc { font-size: 12px; max-width: 100%; }
  .bg-dot { display: none; }
  .btn-pinyin { min-width: 44px; min-height: 44px; }
}

/* Small phone: ≤ 400px */
@media (max-width: 400px) {
  .page { padding: 24px 12px 20px; gap: 20px; }
  .mascot-wrap { width: 64px; height: 64px; }
  .hero h1 { font-size: 18px; }
  .card { padding: 24px 14px 20px; border-radius: 18px; }
  .card-icon { width: 52px; height: 52px; font-size: 28px; }
  .card-title { font-size: 16px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.27.0/dist/index.js"></script>
<script src="/js/global-pinyin.js"></script>
</head>
<body>

<!-- 背景光点 -->
<div class="bg-dot a"></div>
<div class="bg-dot b"></div>
<div class="bg-dot c"></div>
<div class="bg-dot d"></div>

<!-- 透明顶栏 + 拼音胶囊开关 -->
<header class="site-header">
  <button class="btn-pinyin" id="btnPinyin" title="拼音开关">拼</button>
</header>

<div class="page" id="app-content">

  <!-- 小新吉祥物 -->
  <div class="mascot-section">
    <div class="mascot-wrap">
      <!-- 光晕 -->
      <div class="mascot-glow"></div>
      <!-- 闪烁粒子 -->
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <span class="sparkle s4"></span>
      <span class="sparkle s5"></span>
      <!-- SVG 吉祥物本体 -->
      <svg viewBox="0 0 140 140" width="100" height="100" style="position:relative;z-index:2" aria-hidden="true">
        <defs>
          <radialGradient id="bodyGrad" cx="38%" cy="32%">
            <stop offset="0%"   stop-color="#FFD0B0"/>
            <stop offset="50%"  stop-color="#F8A080"/>
            <stop offset="100%" stop-color="#E88060"/>
          </radialGradient>
        </defs>
        <!-- 身体 -->
        <ellipse cx="70" cy="78" rx="44" ry="46" fill="url(#bodyGrad)"/>
        <!-- 左耳朵 -->
        <circle cx="35" cy="38" r="14" fill="url(#bodyGrad)"/>
        <!-- 右耳朵 -->
        <circle cx="105" cy="38" r="14" fill="url(#bodyGrad)"/>
        <!-- 左眼白 -->
        <circle cx="48" cy="68" r="11.5" fill="white"/>
        <!-- 右眼白 -->
        <circle cx="92" cy="68" r="11.5" fill="white"/>
        <!-- 左瞳孔 -->
        <circle cx="52" cy="66" r="6" fill="#3E2010"/>
        <!-- 右瞳孔 -->
        <circle cx="96" cy="66" r="6" fill="#3E2010"/>
        <!-- 左高光 -->
        <circle cx="54.5" cy="62.5" r="2.5" fill="white"/>
        <!-- 右高光 -->
        <circle cx="98.5" cy="62.5" r="2.5" fill="white"/>
        <!-- 左腮红 -->
        <ellipse cx="34" cy="80" rx="8" ry="5.5" fill="rgba(255,140,120,0.32)"/>
        <!-- 右腮红 -->
        <ellipse cx="106" cy="80" rx="8" ry="5.5" fill="rgba(255,140,120,0.32)"/>
        <!-- 微笑 -->
        <path d="M54 90 Q70 104 86 90" stroke="#C05840" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- 标题 -->
  <div class="hero">
    <div class="sub-icon">🔭</div>
    <h1>AI 伯乐 · 探索空间</h1>
    <p>每一段对话，都可能藏着天赋的光</p>
  </div>

  <!-- 角色卡片 -->
  <div class="cards">
    <a class="card card-student" href="/login.html?role=student">
      <div class="card-icon"><svg width="48" height="48" viewBox="0 0 64 64"><use href="#clay-student"/></svg></div>
      <div class="card-title">我是学生</div>
      <div class="card-desc">点这里！和小新一起<br>聊天、画画、探索世界 ✨</div>
    </a>
    <a class="card card-teacher" href="/login.html?role=teacher">
      <div class="card-icon"><svg width="48" height="48" viewBox="0 0 64 64"><use href="#clay-teacher"/></svg></div>
      <div class="card-title">我是老师</div>
      <div class="card-desc">进入画像后台<br>了解学生的潜能地图</div>
    </a>
  </div>

</div>

<script>
// ===== 已登录跳过：已登录则直接跳转对应首页，未登录正常展示选择页 =====
(async function init() {
  try {
    const resp = await fetch('/api/auth/me');
    if (!resp.ok) return; // 未登录 → 正常显示选择页
    const data = await resp.json();
    if (data.user.role === 'teacher') {
      window.location.href = '/teacher-home.html';
    } else {
      window.location.href = '/home.html';
    }
  } catch (_) { /* 网络错误 → 正常显示选择页 */ }
})();
</script>
<script>

// 加载黏土图标 sprite（跨页面共用）
fetch('/icons-sprite.html').then(r => r.text()).then(html => {
  document.body.insertAdjacentHTML('afterbegin', html);
});

</script>
</body>
</html>
