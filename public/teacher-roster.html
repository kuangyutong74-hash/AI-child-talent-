<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生名单 · AI 伯乐</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #FDF7F0; color: #4A1B0C;
  display: flex; flex-direction: column;
}
.header {
  padding: 14px 24px; background: rgba(255,255,255,0.55);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.header h1 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.btn-back, .btn-logout {
  background: transparent; border: 1px solid rgba(0,0,0,0.12); color: #8b6b5a;
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  font-weight: 500; transition: all 0.2s; text-decoration: none;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-back:hover { border-color: #D85A30; color: #D85A30; }
.btn-logout:hover { border-color: #e04040; color: #e04040; }
.header-teacher-name {
  font-size: 13px; color: #8b6b5a; font-weight: 500;
  padding: 4px 12px; background: rgba(216,90,48,0.06); border-radius: 8px;
}

.body { flex: 1; overflow-y: auto; padding: 24px; max-width: 720px; margin: 0 auto; width: 100%; }
.body::-webkit-scrollbar { width: 4px; }
.body::-webkit-scrollbar-thumb { background: #e0d0c0; border-radius: 4px; }

/* ================================================================
   Summary bar
   ================================================================ */
.summary-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 18px; margin-bottom: 18px;
  background: rgba(255,255,255,0.45);
  border: 1px solid rgba(0,0,0,0.04);
  border-radius: 14px; font-size: 13px; color: #a09080;
}
.summary-bar strong { color: #D85A30; font-weight: 700; font-size: 15px; }
.summary-bar-divider { width: 1px; height: 16px; background: rgba(0,0,0,0.08); flex-shrink: 0; }

/* ================================================================
   Mini-card grid
   ================================================================ */
.roster-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.student-card {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6); border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03);
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 12px;
  position: relative;
}
.student-card:hover { background: rgba(255,255,255,0.7); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
.student-card.has-safety {
  border-left: 3px solid #e0a060;
}

/* Mini avatar */
.card-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #fef0e8 0%, #fde0d0 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; border: 2px solid #fdd4b8;
}

/* Main content area */
.card-body { flex: 1; min-width: 0; }

.card-name {
  font-weight: 700; font-size: 14px; color: #4A1B0C;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}

/* Safety warning icon on student card */
.card-safety-warn {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
  background: #fff0f0; color: #c04040; white-space: nowrap; flex-shrink: 0;
}

.card-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

.card-stat {
  display: flex; align-items: center; gap: 3px;
  font-size: 11px; color: #a09080; white-space: nowrap;
}
.card-stat strong { color: #D85A30; font-weight: 700; font-size: 13px; }

.card-active {
  font-size: 11px; color: #c0b0a0; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* Arrow indicator */
.card-arrow {
  color: #d0c8c0; font-size: 14px; flex-shrink: 0;
  transition: all 0.2s;
}
.student-card:hover .card-arrow { color: #D85A30; transform: translateX(2px); }

/* New clue dot */
.card-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #5a8a5a;
  flex-shrink: 0; margin-left: 2px;
}
.card-dot.none { background: #e0d8d0; }

/* ================================================================
   Loading / Empty / Error states
   ================================================================ */
.empty-state { text-align: center; padding: 60px 20px; color: #c0b0a0; font-size: 14px; }
.empty-state .btn-retry, .empty-state .btn-primary {
  display: inline-block; margin-top: 12px; padding: 8px 20px;
  border: 1.5px solid #D85A30; color: #D85A30; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 500; background: transparent;
  transition: all 0.2s; text-decoration: none;
}
.empty-state .btn-retry:hover, .empty-state .btn-primary:hover { background: #D85A30; color: #fff; }

/* ================================================================
   Responsive: Tablet (≤1024px)
   ================================================================ */
@media (max-width: 1024px) {
  .body { max-width: 100%; padding: 20px; }
  .header { padding: 12px 20px; }
}

/* ================================================================
   Responsive: Mobile (≤768px)
   ================================================================ */
@media (max-width: 768px) {
  .header { padding: 10px 14px; }
  .header h1 { font-size: 15px; }
  .header-right { gap: 6px; }
  .btn-back, .btn-logout { min-height: 44px; padding: 8px 12px; font-size: 12px; }
  .body { padding: 14px; max-width: 100%; }
  .summary-bar { padding: 10px 14px; font-size: 12px; gap: 12px; }
  .summary-bar strong { font-size: 14px; }
  .safety-card-header { padding: 12px 14px; }
  .safety-card-icon { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .safety-card-title { font-size: 13px; }
  .safety-card-body { padding: 0 14px 10px; }
  .roster-grid { grid-template-columns: 1fr; gap: 8px; }
  .student-card { padding: 12px 14px; }
  .card-avatar { width: 36px; height: 36px; font-size: 16px; }
  .card-name { font-size: 13px; }
  html, body { -webkit-tap-highlight-color: transparent; }
  .body { -webkit-overflow-scrolling: touch; }
}

/* ================================================================
   Responsive: Small Phone (≤400px)
   ================================================================ */
@media (max-width: 400px) {
  .header { padding: 8px 10px; }
  .header h1 { font-size: 14px; }
  .header-right { gap: 4px; }
  .btn-back, .btn-logout { padding: 6px 10px; font-size: 11px; min-height: 40px; }
  .body { padding: 10px; }
  .summary-bar { padding: 8px 10px; font-size: 11px; gap: 8px; border-radius: 10px; }
  .summary-bar strong { font-size: 13px; }
  .student-card { padding: 10px 12px; border-radius: 12px; }
  .card-avatar { width: 32px; height: 32px; font-size: 14px; }
  .card-name { font-size: 12px; }
  .card-meta { gap: 6px; }
  .card-stat { font-size: 10px; }
  .card-stat strong { font-size: 12px; }
  .card-active { font-size: 10px; }
  .empty-state { padding: 40px 16px; font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">📋 我的学生名单</h1>
  <div class="header-right">
    <span class="header-teacher-name" id="teacherNameDisplay"></span>
    <a class="btn-back" href="/teacher-home.html">← 返回</a>
    <button class="btn-logout" onclick="handleLogout()">退出登录</button>
  </div>
</div>

<div class="body">
  <div class="summary-bar" id="summaryBar" style="display:none;">
    <span>共 <strong id="sumTotal">0</strong> 名学生</span>
    <span class="summary-bar-divider"></span>
    <span id="sumActive">-</span>
    <span class="summary-bar-divider"></span>
    <span>💬 <strong id="sumConv">0</strong> 对话</span>
    <span style="margin-left:auto;">💡 <strong id="sumIns">0</strong> 线索</span>
  </div>

  <div id="rosterList"><div class="empty-state">加载中…</div></div>
</div>

<script>
// ================================================================
//  Login guard
// ================================================================
(function () {
  fetch('/api/auth/me').then(function (resp) {
    if (!resp.ok) { window.location.href = '/login.html?role=teacher'; return null; }
    return resp.json();
  }).then(function (data) {
    if (data && data.user && data.user.role !== 'teacher') {
      window.location.href = '/home.html';
      return;
    }
    if (data.user.username) {
      document.getElementById('teacherNameDisplay').textContent = '👩‍🏫 ' + data.user.username;
    }
  }).catch(function () {
    window.location.href = '/login.html?role=teacher';
  });
})();

function handleLogout() {
  fetch('/api/auth/logout', { method: 'POST' }).then(function () {
    window.location.href = '/login.html?role=teacher';
  });
}

// ================================================================
//  Helpers
// ================================================================

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function txt(text) {
  if (typeof text !== 'string') return '';
  return text;
}

function fmtInt(n) {
  if (typeof n !== 'number' || !isFinite(n) || n < 0) return '0';
  return String(Math.floor(n));
}

function fmtDate(iso) {
  if (!iso) return '暂无对话';
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '暂无对话';
    var diffDays = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (diffDays === 0) return '今天';
    if (diffDays === 1) return '昨天';
    if (diffDays < 7) return diffDays + '天前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  } catch (_e) { return '暂无对话'; }
}

// ================================================================
//  Build loading / empty / error states
// ================================================================

function showLoading(list) {
  list.textContent = '';
  var div = el('div', 'empty-state');
  div.textContent = '加载中…';
  list.appendChild(div);
}

function showEmpty(list) {
  list.textContent = '';
  var div = el('div', 'empty-state');
  div.appendChild(document.createTextNode('还没有绑定学生'));
  div.appendChild(el('br'));
  var hint = el('span');
  hint.style.fontSize = '12px';
  hint.textContent = '请学生在他的「我的」页面创建邀请码，然后在教师首页输入邀请码';
  div.appendChild(hint);
  div.appendChild(el('br'));
  var btn = el('a', 'btn-primary');
  btn.href = '/teacher-home.html';
  btn.textContent = '← 返回教师首页';
  div.appendChild(btn);
  list.appendChild(div);
}

function showError(list, msg) {
  list.textContent = '';
  var div = el('div', 'empty-state');
  div.textContent = txt(msg) || '加载失败';
  div.appendChild(el('br'));
  var btn = el('button', 'btn-retry');
  btn.textContent = '重新加载';
  btn.addEventListener('click', loadRoster);
  div.appendChild(btn);
  list.appendChild(div);
}

// ================================================================
//  Build one mini student card entirely via DOM API
// ================================================================

function buildCard(s) {
  var card = el('div', 'student-card');

  var sc = (typeof s.safetyAlertCount === 'number' && s.safetyAlertCount >= 0) ? s.safetyAlertCount : 0;
  if (sc > 0) card.classList.add('has-safety');

  card.dataset.studentId = String(s.studentId || '');
  card.addEventListener('click', function () {
    viewStudent(card.dataset.studentId);
  });

  // — avatar —
  var avatar = el('div', 'card-avatar');
  avatar.textContent = '🧑‍🎓';
  card.appendChild(avatar);

  // — body —
  var body = el('div', 'card-body');

  // name + optional safety warning
  var nameDiv = el('div', 'card-name');
  nameDiv.textContent = txt(s.username);
  if (sc > 0) {
    var warnSpan = el('span', 'card-safety-warn');
    warnSpan.textContent = '⚠' + sc;
    nameDiv.appendChild(warnSpan);
  }
  body.appendChild(nameDiv);

  // meta row: stats + active time
  var meta = el('div', 'card-meta');

  var statConv = el('span', 'card-stat');
  statConv.textContent = '💬 ';
  var strongConv = el('strong');
  strongConv.textContent = fmtInt(s.totalConversations);
  statConv.appendChild(strongConv);
  statConv.appendChild(document.createTextNode(' 对话'));
  meta.appendChild(statConv);

  var statIns = el('span', 'card-stat');
  statIns.textContent = '💡 ';
  var strongIns = el('strong');
  strongIns.textContent = fmtInt(s.insightCount);
  statIns.appendChild(strongIns);
  statIns.appendChild(document.createTextNode(' 线索'));
  meta.appendChild(statIns);

  var activeSpan = el('span', 'card-active');
  var recentN = (typeof s.recentInsightCount7d === 'number' && s.recentInsightCount7d >= 0) ? s.recentInsightCount7d : 0;
  activeSpan.textContent = fmtDate(s.lastActiveDate);
  if (recentN > 0) {
    activeSpan.textContent += ' · +' + recentN;
  }
  meta.appendChild(activeSpan);

  body.appendChild(meta);
  card.appendChild(body);

  // — new-clue dot —
  var dot = el('span', 'card-dot');
  if (recentN === 0) dot.classList.add('none');
  card.appendChild(dot);

  // — arrow —
  var arrow = el('span', 'card-arrow');
  arrow.textContent = '›';
  card.appendChild(arrow);

  return card;
}

// ================================================================
//  Load & render roster
// ================================================================

function loadRoster() {
  var list = document.getElementById('rosterList');
  var bar = document.getElementById('summaryBar');
  showLoading(list);
  bar.style.display = 'none';

  fetch('/api/teacher/roster').then(function (resp) {
    if (resp.status === 401) {
      window.location.href = '/login.html?role=teacher';
      return null;
    }
    if (resp.status === 403) {
      showError(list, '当前账号不是教师，无法查看学生名单');
      return null;
    }
    if (!resp.ok) {
      return resp.json().catch(function () { return {}; }).then(function (errData) {
        showError(list, errData.error || '加载失败');
        return null;
      });
    }
    return resp.json().then(function (data) {
      if (!Array.isArray(data) || data.length === 0) {
        showEmpty(list);
        return;
      }

      // Summary bar
      var total = data.length;
      var totalConv = 0;
      var totalIns = 0;
      var activeCount = 0;

      for (var i = 0; i < data.length; i++) {
        totalConv += (typeof data[i].totalConversations === 'number' ? data[i].totalConversations : 0);
        totalIns += (typeof data[i].insightCount === 'number' ? data[i].insightCount : 0);
        var rn = (typeof data[i].recentInsightCount7d === 'number' && data[i].recentInsightCount7d >= 0) ? data[i].recentInsightCount7d : 0;
        if (rn > 0) activeCount++;
      }

      document.getElementById('sumTotal').textContent = String(total);
      document.getElementById('sumActive').textContent = activeCount > 0
        ? activeCount + ' 名近期活跃'
        : '近期暂无新线索';
      document.getElementById('sumConv').textContent = fmtInt(totalConv);
      document.getElementById('sumIns').textContent = fmtInt(totalIns);
      bar.style.display = '';

      // Cards grid
      list.textContent = '';
      var grid = el('div', 'roster-grid');
      for (var j = 0; j < data.length; j++) {
        grid.appendChild(buildCard(data[j]));
      }
      list.appendChild(grid);
    });
  }).catch(function () {
    showError(list, '网络错误，请检查网络连接后刷新页面');
  });
}

// ================================================================
//  View student → detail page
// ================================================================

function viewStudent(studentId) {
  window.location.href = '/teacher-student.html?studentId=' + encodeURIComponent(String(studentId));
}

// Load on page load
loadRoster();
</script>
</body>
</html>
